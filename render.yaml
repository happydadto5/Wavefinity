services:
  - type: web
    name: wavefinity
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python wavefinity_web.py --host 0.0.0.0 --no-browser
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: WAVEFINITY_PID_FILE
        value: /tmp/wavefinity.pid
