services:
  - type: web
    name: wavefinity
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: pip install -r requirements.txt && python -c "import wavefinity_web"
    startCommand: WAVEFINITY_DEPLOYMENT=hosted python wavefinity_web.py --host 0.0.0.0 --no-browser
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.8"
      - key: WAVEFINITY_PID_FILE
        value: /tmp/wavefinity.pid
      - key: WAVEFINITY_DEPLOYMENT
        value: hosted
